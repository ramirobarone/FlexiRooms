
<app-search-bar (_hotelesEmitter)="loadHotels($event)" (noResults)="showNoResultsPopup()"></app-search-bar>

<app-popup
  [visible]="isNoResultsPopupVisible"
  title="Sin resultados"
  description="No hay hoteles disponibles con esa busqueda."
  (closed)="isNoResultsPopupVisible = false">
</app-popup>

<div class="row justify-content-center">
  @for (item of _hoteles; track item) {
    <span class="col-md-3" style="margin: 20px">
      <app-card-hotel name="{{ item.name }}"
        description="{{ item.description}}"
        idHotel="{{item.id}}"
      [images]="item.pictures"></app-card-hotel>
    </span>
  }
</div>

@if (isBodyVisible) {
  <div class="row align-items-center justify-content-center text-center">
    <app-body-principal></app-body-principal>
  </div>
}
