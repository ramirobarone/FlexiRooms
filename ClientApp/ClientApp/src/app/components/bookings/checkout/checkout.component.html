<section class="checkout-payment" aria-label="Pago">
  <div aria-live="polite">
    @if (errorMessage) {
      <div class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>{{ errorMessage }}
      </div>
    }
    @if (successMessage) {
      <div class="alert alert-success" role="status">
        <i class="bi bi-check-circle me-2" aria-hidden="true"></i>{{ successMessage }}
      </div>
    }
  </div>
  <div id="cardPaymentBrick_container"></div>
  <p class="checkout-secure text-muted">
    <i class="bi bi-lock-fill me-1" aria-hidden="true"></i>Pago procesado de forma segura por Mercado Pago.
  </p>
</section>
