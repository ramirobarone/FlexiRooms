name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: flexiRooms
  APP_NAME: flexiRooms
  APP_PORT: "7291"
  POSTGRES_DB: roomContainer
  POSTGRES_USER: postgres
  POSTGRES_PORT: "5432"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ClientApp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          test -n "$SSH_PRIVATE_KEY_BASE64" || {
            echo "SSH_PRIVATE_KEY_BASE64 is not configured"
            exit 1
          }
          printf '%s' "$SSH_PRIVATE_KEY_BASE64" | base64 --decode > ~/.ssh/id_deploy || {
            echo "SSH_PRIVATE_KEY_BASE64 is not valid Base64"
            exit 1
          }
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null || {
            echo "SSH_PRIVATE_KEY_BASE64 does not decode to a valid, unencrypted OpenSSH private key"
            exit 1
          }
          ssh-keyscan -p 5283 149.50.150.67 >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host 149.50.150.67
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          SSH_CONFIG
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          ssh -o BatchMode=yes -p5283 root@149.50.150.67 'bash -se' <<'REMOTE_SCRIPT'
            set -e
            printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
            docker rm -f ${{ env.APP_NAME }} || true
            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:8080 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://+:8080 \
              -e ConnectionStrings__flexiRooms="Host=${{ secrets.POSTGRES_HOST }};Port=${{ env.POSTGRES_PORT }};Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ secrets.POSTGRES_PASSWORD }}" \
              -v hotel-images:/app/wwwroot/hotel-images \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
            docker image prune -f
          REMOTE_SCRIPT
