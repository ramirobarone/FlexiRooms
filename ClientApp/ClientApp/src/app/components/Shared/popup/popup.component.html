<dialog class="rounded-surface" [appModal]="visible" (dismiss)="onClose()" #modal="appModal"
  aria-labelledby="popup-title" aria-describedby="popup-description">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="popup-title" class="modal-title h5">{{ title }}</h2>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="modal.requestClose()"></button>
    </div>
    <div class="modal-body">
      <p id="popup-description">{{ description }}</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-success" autofocus (click)="modal.requestClose()">Entendido</button>
    </div>
  </div>
</dialog>
