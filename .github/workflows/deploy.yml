name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: flexiRooms
  APP_NAME: flexiRooms
  APP_PORT: "7291"
  POSTGRES_DB: roomContainer
  POSTGRES_USER: postgres
  POSTGRES_PORT: "5432"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ClientApp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          test -n "$SSH_PRIVATE_KEY_BASE64" || {
            echo "SSH_PRIVATE_KEY_BASE64 is not configured"
            exit 1
          }
          printf '%s' "$SSH_PRIVATE_KEY_BASE64" | base64 --decode > ~/.ssh/id_deploy || {
            echo "SSH_PRIVATE_KEY_BASE64 is not valid Base64"
            exit 1
          }
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null || {
            echo "SSH_PRIVATE_KEY_BASE64 does not decode to a valid, unencrypted OpenSSH private key"
            exit 1
          }
          ssh-keyscan -p 5283 149.50.150.67 >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host 149.50.150.67
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          SSH_CONFIG
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts
          ssh -o BatchMode=yes -p5283 root@149.50.150.67 'bash -se' <<'REMOTE_SCRIPT'
            set -e
            mkdir -p /opt/flexiRooms
            cd /opt/flexiRooms
            cat > docker-compose.prod.yml <<'EOF'
            services:
              postgres:
                image: postgres:16
                container_name: flexiRooms-postgres
                restart: unless-stopped
                environment:
                  POSTGRES_DB: ${POSTGRES_DB}
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                ports:
                  - "${POSTGRES_PORT:-5432}:5432"
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              app:
                image: ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${IMAGE_TAG:-latest}
                container_name: flexiRooms-app
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                environment:
                  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
                  ASPNETCORE_URLS: http://+:8080
                  ConnectionStrings__flexiRooms: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
                ports:
                  - "${APP_PORT:-7291}:8080"
                volumes:
                  - hotel-images:/app/wwwroot/hotel-images

            volumes:
              postgres-data:
              hotel-images:
            EOF
            cat > .env <<'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_REPOSITORY=${{ env.DOCKERHUB_REPOSITORY }}
            IMAGE_TAG=latest
            ASPNETCORE_ENVIRONMENT=Production
            APP_PORT=${{ env.APP_PORT }}
            POSTGRES_DB=${{ env.POSTGRES_DB }}
            POSTGRES_USER=${{ env.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            EOF
            printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d
            docker image prune -f
          REMOTE_SCRIPT
