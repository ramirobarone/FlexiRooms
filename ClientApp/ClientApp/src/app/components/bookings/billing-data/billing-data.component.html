<form (ngSubmit)="onSubmit()" class="mt-2" [formGroup]="billingForm" novalidate>
  <div class="row g-3">

    <div class="col-12">
      <label for="name" class="form-label">Nombre completo</label>
      <input type="text" id="name" name="name" class="form-control" formControlName="name" autocomplete="name"
        [(ngModel)]="billingData.customerName"
        [class.is-invalid]="billingForm.get('name')?.invalid && !billingForm.get('name')?.pristine"
        aria-describedby="name-error">
      <div id="name-error" class="invalid-feedback">Ingresá tu nombre completo.</div>
    </div>

    <div class="col-md-8">
      <label for="address" class="form-label">Dirección</label>
      <input type="text" id="address" name="address" class="form-control" formControlName="address" autocomplete="street-address"
        [(ngModel)]="billingData.address"
        [class.is-invalid]="billingForm.get('address')?.invalid && !billingForm.get('address')?.pristine"
        aria-describedby="address-error" />
      <div id="address-error" class="invalid-feedback">Ingresá la dirección.</div>
    </div>

    <div class="col-md-4">
      <label for="zip" class="form-label">Código postal</label>
      <input type="text" id="zip" name="zip" class="form-control" formControlName="zip" autocomplete="postal-code" inputmode="numeric"
        [(ngModel)]="billingData.zipCode"
        [class.is-invalid]="billingForm.get('zip')?.invalid && !billingForm.get('zip')?.pristine"
        aria-describedby="zip-error">
      <div id="zip-error" class="invalid-feedback">Ingresá el código postal.</div>
    </div>

    <div class="col-md-4">
      <label for="city" class="form-label">Ciudad</label>
      <input type="text" id="city" name="city" class="form-control" formControlName="city" autocomplete="address-level2"
        [(ngModel)]="billingData.city"
        [class.is-invalid]="billingForm.get('city')?.invalid && !billingForm.get('city')?.pristine"
        aria-describedby="city-error">
      <div id="city-error" class="invalid-feedback">Ingresá la ciudad.</div>
    </div>

    <div class="col-md-4">
      <label for="state" class="form-label">Provincia</label>
      <input type="text" id="state" name="state" class="form-control" formControlName="state" autocomplete="address-level1"
        [(ngModel)]="billingData.state"
        [class.is-invalid]="billingForm.get('state')?.invalid && !billingForm.get('state')?.pristine"
        aria-describedby="state-error">
      <div id="state-error" class="invalid-feedback">Ingresá la provincia.</div>
    </div>

    <div class="col-md-4">
      <label for="country" class="form-label">País</label>
      <input type="text" id="country" name="country" class="form-control" formControlName="country" autocomplete="country-name"
        [(ngModel)]="billingData.country"
        [class.is-invalid]="billingForm.get('country')?.invalid && !billingForm.get('country')?.pristine"
        aria-describedby="country-error" />
      <div id="country-error" class="invalid-feedback">Ingresá el país.</div>
    </div>

    <div class="col-md-6">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" name="email" class="form-control" formControlName="email" autocomplete="email" inputmode="email"
        [(ngModel)]="billingData.email"
        [class.is-invalid]="billingForm.get('email')?.invalid && !billingForm.get('email')?.pristine"
        aria-describedby="email-error" />
      <div id="email-error" class="invalid-feedback">Ingresá un email válido.</div>
    </div>

    <div class="col-md-6">
      <label for="phone" class="form-label">Teléfono</label>
      <input type="tel" id="phone" name="phone" class="form-control" formControlName="phone" autocomplete="tel" inputmode="tel"
        [(ngModel)]="billingData.phoneNumber"
        [class.is-invalid]="billingForm.get('phone')?.invalid && !billingForm.get('phone')?.pristine"
        aria-describedby="phone-error" />
      <div id="phone-error" class="invalid-feedback">Ingresá un número de teléfono.</div>
    </div>

    <div class="col-12 billing-actions">
      <button type="submit" class="btn btn-success" [disabled]="billingForm.invalid">
        Continuar al pago<i class="bi bi-chevron-right ms-1" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</form>
