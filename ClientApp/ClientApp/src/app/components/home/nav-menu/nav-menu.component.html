<header>
  <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light mb-3" aria-label="Navegación principal">
    <div class="container">
      <a class="navbar-brand" [routerLink]="['/']" aria-label="Flexi Rooms, inicio">
        <img src="assets/logo.png" alt="" class="application-logo" width="48" height="48" />
      </a>
      <button class="navbar-toggler" type="button" aria-controls="main-nav"
        [attr.aria-label]="isExpanded ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="isExpanded" (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="main-nav" class="navbar-collapse collapse d-sm-inline-flex justify-content-end" [ngClass]="{ show: isExpanded }">
        <ul class="navbar-nav flex-grow align-items-sm-center">
          @if (isLoged) {
            <li class="nav-item" routerLinkActive="link-active">
              <a class="nav-link" [routerLink]="['/MisReservas']" ariaCurrentWhenActive="page">
                <i class="bi bi-calendar2-check me-1" aria-hidden="true"></i>Mis reservas
              </a>
            </li>
            <li class="nav-item" routerLinkActive="link-active">
              <a class="nav-link" [routerLink]="['/miCuenta']" ariaCurrentWhenActive="page">
                <i class="bi bi-person me-1" aria-hidden="true"></i>Mi cuenta
              </a>
            </li>
          }
          @if (canAccessControlPanel) {
            <li class="nav-item" routerLinkActive="link-active">
              <a class="nav-link" [routerLink]="['/admin']" ariaCurrentWhenActive="page">
                <i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Panel de control
              </a>
            </li>
          }
          @if (!isLoged) {
            <li class="nav-item" routerLinkActive="link-active">
              <a class="nav-link" [routerLink]="['/login']" ariaCurrentWhenActive="page">
                <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Ingresar
              </a>
            </li>
          }
        </ul>
        @if (isLoged) {
          <div class="user-profile">
            <span id="userName" class="user-name">{{ userName }}</span>
            <img class="user-avatar" [src]="profileImageUrl" alt="" width="36" height="36" />
            <button class="logout-button" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" (click)="logout()">
              <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        }
      </div>
    </div>
  </nav>
</header>
