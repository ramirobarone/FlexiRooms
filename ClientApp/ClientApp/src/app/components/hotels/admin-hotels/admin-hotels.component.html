<div class="row g-4">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>Hoteles</span>
        <button class="btn btn-sm btn-light" type="button" (click)="newHotel()">Nuevo</button>
      </div>
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let hotel of hotels">
              <td>{{ hotel.name }}</td>
              <td>{{ hotel.email }}</td>
              <td>{{ hotel.phoneNumber }}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-2" type="button" (click)="editHotel(hotel)">Editar</button>
                <button class="btn btn-sm btn-outline-danger" type="button" (click)="deleteHotel(hotel.id)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">
        {{ isEditing ? 'Editar hotel' : 'Nuevo hotel' }}
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="selectedHotel.name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea class="form-control" rows="3" [(ngModel)]="selectedHotel.description"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Meta descripción</label>
          <input class="form-control" [(ngModel)]="selectedHotel.metaDescription" />
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input class="form-control" [(ngModel)]="selectedHotel.email" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input class="form-control" type="number" [(ngModel)]="selectedHotel.phoneNumber" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Código área</label>
            <input class="form-control" type="number" [(ngModel)]="selectedHotel.codeArea" />
          </div>
          <div class="col-md-8">
            <label class="form-label">Calle</label>
            <input class="form-control" [(ngModel)]="selectedHotel.addressHotel.street" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Número</label>
            <input class="form-control" [(ngModel)]="selectedHotel.addressHotel.number" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Código postal</label>
            <input class="form-control" [(ngModel)]="selectedHotel.addressHotel.postalCode" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Provincia</label>
            <select class="form-select" [(ngModel)]="selectedHotel.addressHotel.idProvince" (ngModelChange)="onProvinceChange()">
              <option [ngValue]="0">Seleccione una provincia</option>
              <option *ngFor="let province of provinces" [ngValue]="province.id">{{ province.name }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Ciudad</label>
            <select class="form-select" [(ngModel)]="selectedHotel.addressHotel.idCity" [disabled]="!cities.length">
              <option [ngValue]="0">Seleccione una ciudad</option>
              <option *ngFor="let city of cities" [ngValue]="city.id">{{ city.name }}</option>
            </select>
          </div>
        </div>
        <div class="mt-3 d-grid">
          <button class="btn btn-primary" type="button" (click)="saveHotel()">Guardar hotel</button>
        </div>
      </div>
    </div>
  </div>
</div>
