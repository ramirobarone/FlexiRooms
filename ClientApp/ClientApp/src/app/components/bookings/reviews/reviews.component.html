<section class="reviews-container">
  <div class="reviews-panel rounded-surface">
    <h1 class="h4 mb-1">Dejanos tu reseña</h1>
    <p class="text-muted mb-4">Tu opinión ayuda a otros viajeros.</p>

    @if (!submitSuccess) {
      <fieldset class="mb-3" [disabled]="isSubmitting">
        <legend class="form-label">Valoración general</legend>
        <div class="rating" role="radiogroup" aria-label="Valoración de 1 a 5 estrellas">
          @for (n of [1, 2, 3, 4, 5]; track n) {
            <input class="visually-hidden" type="radio" name="rating" [id]="'rating-' + n" [value]="n" [(ngModel)]="value" />
            <label class="rating-star" [for]="'rating-' + n" [class.is-on]="n <= value">
              <i class="bi" [ngClass]="n <= value ? 'bi-star-fill' : 'bi-star'" aria-hidden="true"></i>
              <span class="visually-hidden">{{ n }} {{ n === 1 ? 'estrella' : 'estrellas' }}</span>
            </label>
          }
          <span class="rating-value" aria-hidden="true">{{ value }}/5</span>
        </div>
      </fieldset>

      <div class="mb-3">
        <label class="form-label" for="reviewText">Tu reseña</label>
        <textarea id="reviewText" class="form-control" rows="4" [(ngModel)]="reviewText" [disabled]="isSubmitting"
          placeholder="Contanos tu experiencia"></textarea>
      </div>

      <div class="reviews-actions">
        <button class="btn btn-success" type="button" (click)="submit()" [disabled]="isSubmitting">
          @if (isSubmitting) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          }
          {{ isSubmitting ? 'Enviando…' : 'Enviar reseña' }}
        </button>
        <a class="btn btn-outline-secondary" routerLink="/MisReservas">Volver</a>
      </div>

      <div aria-live="assertive">
        @if (submitError) {
          <div class="alert alert-danger reviews-alert" role="alert">
            <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>
            {{ submitError }}
          </div>
        }
      </div>
    }

    @if (submitSuccess) {
      <div class="alert alert-success" role="status">
        <i class="bi bi-check2-circle me-2" aria-hidden="true"></i>
        ¡Gracias por tu reseña!
      </div>
      <a class="btn btn-outline-secondary" routerLink="/MisReservas">Volver a mis reservas</a>
    }
  </div>
</section>
