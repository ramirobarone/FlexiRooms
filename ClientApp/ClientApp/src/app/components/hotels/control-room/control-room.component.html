<div class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h1 class="h2 mb-1">Panel de control</h1>
        <p class="text-muted mb-0">Administrá hoteles, habitaciones y reservas.</p>
      </div>
      <div class="btn-group" role="group" aria-label="Secciones del panel">
        <button type="button" class="btn" [ngClass]="activeTab === 'summary' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'summary'" (click)="activeTab = 'summary'">Resumen</button>
        <button type="button" class="btn" [ngClass]="activeTab === 'hotels' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'hotels'" (click)="activeTab = 'hotels'">Hoteles</button>
        <button type="button" class="btn" [ngClass]="activeTab === 'rooms' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'rooms'" (click)="activeTab = 'rooms'">Habitaciones</button>
        <button type="button" class="btn" [ngClass]="activeTab === 'bookings' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'bookings'" (click)="activeTab = 'bookings'">Reservas</button>
        <button type="button" class="btn" [ngClass]="activeTab === 'issues' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'issues'" (click)="activeTab = 'issues'">Reclamos</button>
        <button type="button" class="btn" [ngClass]="activeTab === 'maintenance' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'maintenance'" (click)="activeTab = 'maintenance'">Mantenimiento</button>
        @if (isSuperAdmin) {
          <button type="button" class="btn" [ngClass]="activeTab === 'approvals' ? 'btn-dark' : 'btn-outline-dark'" [attr.aria-pressed]="activeTab === 'approvals'" (click)="activeTab = 'approvals'">Aprobaciones</button>
        }
      </div>
    </div>

    @switch (activeTab) {
      @case ('summary') {
        <div class="row g-3 summary-grid">
          <div class="col-sm-6 col-lg-4">
            <button type="button" class="summary-tile" (click)="activeTab = 'hotels'">
              <span class="tile-icon tile-icon--blue" aria-hidden="true"><i class="bi bi-building"></i></span>
              <span class="tile-title">Hoteles</span>
              <span class="tile-text">Creá y editá la oferta publicada.</span>
              <i class="bi bi-chevron-right tile-chevron" aria-hidden="true"></i>
            </button>
          </div>
          <div class="col-sm-6 col-lg-4">
            <button type="button" class="summary-tile" (click)="activeTab = 'rooms'">
              <span class="tile-icon tile-icon--green" aria-hidden="true"><i class="bi bi-door-open"></i></span>
              <span class="tile-title">Habitaciones</span>
              <span class="tile-text">Gestioná habitaciones, precios e imágenes.</span>
              <i class="bi bi-chevron-right tile-chevron" aria-hidden="true"></i>
            </button>
          </div>
          <div class="col-sm-6 col-lg-4">
            <button type="button" class="summary-tile" (click)="activeTab = 'bookings'">
              <span class="tile-icon tile-icon--indigo" aria-hidden="true"><i class="bi bi-calendar2-check"></i></span>
              <span class="tile-title">Reservas</span>
              <span class="tile-text">Consultá el historial y eliminá reservas inválidas.</span>
              <i class="bi bi-chevron-right tile-chevron" aria-hidden="true"></i>
            </button>
          </div>
          <div class="col-sm-6 col-lg-4">
            <button type="button" class="summary-tile" (click)="activeTab = 'issues'">
              <span class="tile-icon tile-icon--orange" aria-hidden="true"><i class="bi bi-exclamation-octagon"></i></span>
              <span class="tile-title">Reclamos</span>
              <span class="tile-text">Consultá y actualizá los reclamos de tu hotel.</span>
              <i class="bi bi-chevron-right tile-chevron" aria-hidden="true"></i>
            </button>
          </div>
          @if (isSuperAdmin) {
            <div class="col-sm-6 col-lg-4">
              <button type="button" class="summary-tile" (click)="activeTab = 'approvals'">
                <span class="tile-icon tile-icon--indigo" aria-hidden="true"><i class="bi bi-patch-check"></i></span>
                <span class="tile-title">Aprobaciones</span>
                <span class="tile-text">Revisá y publicá los hoteles que se registraron.</span>
                <i class="bi bi-chevron-right tile-chevron" aria-hidden="true"></i>
              </button>
            </div>
          }
          <div class="col-sm-6 col-lg-4">
            <button type="button" class="summary-tile" (click)="activeTab = 'maintenance'">
              <span class="tile-icon tile-icon--teal" aria-hidden="true"><i class="bi bi-tools"></i></span>
              <span class="tile-title">Mantenimiento</span>
              <span class="tile-text">Configurá el personal responsable de cada tipo de solicitud.</span>
              <i class="bi bi-chevron-right tile-chevron" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      }
      @case ('hotels') {
        <app-admin-hotels></app-admin-hotels>
      }
      @case ('rooms') {
        <app-admin-room></app-admin-room>
      }
      @case ('bookings') {
        <app-admin-bookings></app-admin-bookings>
      }
      @case ('issues') {
        <app-admin-issues></app-admin-issues>
      }
      @case ('maintenance') {
        <app-admin-maintenance></app-admin-maintenance>
      }
      @case ('approvals') {
        <app-admin-approvals></app-admin-approvals>
      }
    }
  </div>
</div>
