@if (!isLoading && user) {
  <section class="account-container">
    <div class="account-panel rounded-surface">
      <div class="account-header">
        <div>
          <h1>Mi cuenta</h1>
          <p class="text-muted mb-0">Administrá tus datos personales.</p>
        </div>
        <div class="profile-photo-container">
          <img class="profile-photo" [src]="user.profileImageUrl || 'assets/exterior.jpg'" alt="Foto de perfil" width="96" height="96" />
          <label class="photo-button" title="Cambiar foto de perfil" [class.is-busy]="isUploading">
            @if (isUploading) {
              <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            } @else {
              <i class="bi bi-camera" aria-hidden="true"></i>
            }
            <span class="visually-hidden">Cambiar foto de perfil</span>
            <input type="file" accept="image/jpeg,image/png,image/webp" (change)="uploadProfileImage($event)" [disabled]="isUploading" />
          </label>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="email">Email</label>
          <input id="email" class="form-control" [value]="user.email" readonly aria-describedby="email-help" />
          <div id="email-help" class="form-text">El email no se puede modificar.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="identityNumber">Número de documento</label>
          <input id="identityNumber" class="form-control" [(ngModel)]="user.identityNumber" inputmode="numeric" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="name">Nombre</label>
          <input id="name" class="form-control" [(ngModel)]="user.name" autocomplete="given-name" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="secondName">Segundo nombre</label>
          <input id="secondName" class="form-control" [(ngModel)]="user.secondName" autocomplete="additional-name" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="lastName">Apellido</label>
          <input id="lastName" class="form-control" [(ngModel)]="user.lastName" autocomplete="family-name" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="codeArea">Código de área</label>
          <input id="codeArea" class="form-control" [(ngModel)]="user.codeArea" inputmode="numeric" autocomplete="tel-area-code" />
        </div>
        <div class="col-md-8">
          <label class="form-label" for="phoneNumber">Teléfono</label>
          <input id="phoneNumber" type="tel" class="form-control" [(ngModel)]="user.phoneNumber" inputmode="tel" autocomplete="tel-local" />
        </div>
      </div>
      <div class="account-actions">
        <button class="btn btn-success" type="button" (click)="saveInformation()" [disabled]="isSaving || isUploading">
          @if (isSaving) {
            <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
          } @else {
            <i class="bi bi-check2 me-1" aria-hidden="true"></i>
          }
          {{ isSaving ? 'Guardando…' : 'Guardar cambios' }}
        </button>
        <div aria-live="polite">
          @if (message) {
            <span class="account-feedback text-success" role="status"><i class="bi bi-check-circle-fill me-1" aria-hidden="true"></i>{{ message }}</span>
          }
          @if (errorMessage) {
            <span class="account-feedback text-danger" role="alert"><i class="bi bi-exclamation-circle-fill me-1" aria-hidden="true"></i>{{ errorMessage }}</span>
          }
        </div>
      </div>
    </div>
  </section>
}

@if (isLoading) {
  <div class="account-state" role="status" aria-live="polite">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    <span>Cargando información…</span>
  </div>
}
@if (!isLoading && !user) {
  <div class="account-state text-danger" role="alert">
    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
    <span>{{ errorMessage }}</span>
  </div>
}
