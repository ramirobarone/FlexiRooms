name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: flexiRooms
  APP_NAME: flexiRooms
  APP_PORT: "7291"
  POSTGRES_DB: flexirooms
  POSTGRES_USER: postgres
  POSTGRES_PORT: "5432"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ClientApp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate SSH private key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p .ssh
          printf '%b\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > .ssh/deploy_key
          chmod 600 .ssh/deploy_key

          if ! grep -Eq '^-----BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY-----$' .ssh/deploy_key; then
            echo "::error::SSH_PRIVATE_KEY must contain the complete private key, including its BEGIN/END lines."
            exit 1
          fi

      - name: Deploy image to server over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key_path: .ssh/deploy_key
          script: |
            docker pull ramirobarone/flexirooms:latest
            docker stop flexirooms_api || true
            docker rm flexirooms_api || true
            docker run -d --name flexirooms_api --network flexirooms_net -p 8080:8080 -v flexirooms_uploads:/app/wwwroot/hotel-images --restart always ramirobarone/flexirooms:latest
