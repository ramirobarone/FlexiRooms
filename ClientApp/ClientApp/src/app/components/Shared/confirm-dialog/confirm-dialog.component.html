<dialog class="confirm-dialog" role="alertdialog"
  [appModal]="!!confirmService.request()" (dismiss)="onDismiss()" #modal="appModal"
  aria-labelledby="confirm-title" aria-describedby="confirm-message">
  @if (confirmService.request(); as req) {
    <div class="confirm-body">
      @if (req.destructive) {
        <span class="confirm-icon" aria-hidden="true"><i class="bi bi-trash3"></i></span>
      }
      <h2 id="confirm-title" class="confirm-title">{{ req.title }}</h2>
      @if (req.message) {
        <p id="confirm-message" class="confirm-message">{{ req.message }}</p>
      }
    </div>
    <div class="confirm-actions">
      <!-- Safe choice first and focused: Enter never destroys anything by accident -->
      <button type="button" class="btn confirm-cancel" autofocus (click)="choose(false, modal)">{{ req.cancelText }}</button>
      <button type="button" class="btn" [class.confirm-destructive]="req.destructive" [class.btn-success]="!req.destructive"
        (click)="choose(true, modal)">{{ req.confirmText }}</button>
    </div>
  }
</dialog>
