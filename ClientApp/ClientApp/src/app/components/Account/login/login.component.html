<div class="login-container">
  <div class="login-panel rounded-surface">

    <img src="assets/logo.png" alt="Logo" class="img-fluid mb-4 w-50 centered" />

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="userDto.email" title="Enter your email"
        placeholder="Email" />

        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="userDto.password" title="Enter your password"
          placeholder="Password" />

        </div>
        <div class="login-actions spacingButton">
          <button class="btn btn-outline-success" type="button" (click)="login()" [disabled]="isLoading">
            @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
          </button>
          <button class="btn btn-success" type="button" [routerLink]="['/accountCreate']" [disabled]="isLoading">Crear Cuenta</button>
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger login-alert" role="alert">
            <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>
            {{ errorMessage }}
          </div>
        }

      </div>
    </div>
