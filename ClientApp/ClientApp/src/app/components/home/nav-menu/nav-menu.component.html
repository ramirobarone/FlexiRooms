<header>
  <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow mb-3">
    <div class="container">
      <a class="navbar-brand" [routerLink]="['/']" aria-label="Flexi Rooms">
        <img src="assets/logo.png" alt="Flexi Rooms" class="application-logo" />
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target=".navbar-collapse"
        aria-label="Toggle navigation" [attr.aria-expanded]="isExpanded" (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse collapse d-sm-inline-flex justify-content-end" [ngClass]="{ show: isExpanded }">
        <ul class="navbar-nav flex-grow align-items-sm-center">
          @if (isLoged) {
            <li class="nav-item" [routerLinkActive]="['link-active']">
              <a class="nav-link text-dark" [routerLink]="['/MisReservas']">Mis Reservas</a>
            </li>
          }
          @if (isLoged) {
            <li class="nav-item" [routerLinkActive]="['link-active']">
              <a class="nav-link text-dark" [routerLink]="['/miCuenta']">Mi Cuenta</a>
            </li>
          }
          @if (canAccessControlPanel) {
            <li class="nav-item" [routerLinkActive]="['link-active']">
              <a class="nav-link text-dark fw-semibold" [routerLink]="['/admin']">Panel de Control</a>
            </li>
          }
          <li class="nav-item" [routerLinkActive]="['link-active']">
            @if (!isLoged) {
              <a class="nav-link text-dark" [routerLink]="['/login']">Ingresar</a>
            }
            @if (isLoged) {
              <button class="logout-button" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" (click)="logout()">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
              </button>
            }
          </li>
        </ul>
        @if (isLoged) {
          <div class="user-profile">
            <span id="userName" class="user-name">{{ userName }}</span>
            <img class="user-avatar" [src]="profileImageUrl" alt="Fotografía de usuario" />
          </div>
        }
      </div>
    </div>
  </nav>
</header>
