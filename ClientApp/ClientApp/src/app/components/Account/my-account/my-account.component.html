<section class="account-container" *ngIf="!isLoading && user">
  <div class="account-panel rounded-surface">
    <div class="account-header">
      <div>
        <h1>Mi cuenta</h1>
        <p class="text-muted mb-0">Administra tus datos personales.</p>
      </div>
      <div class="profile-photo-container">
        <img class="profile-photo" [src]="user.profileImageUrl || 'assets/exterior.jpg'" alt="Foto de perfil" />
        <label class="photo-button" title="Cambiar foto de perfil">
          <i class="bi bi-camera" aria-hidden="true"></i>
          <span class="visually-hidden">Cambiar foto de perfil</span>
          <input type="file" accept="image/jpeg,image/png,image/webp" (change)="uploadProfileImage($event)" [disabled]="isUploading" />
        </label>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="email">Email</label>
        <input id="email" class="form-control" [value]="user.email" readonly />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="identityNumber">Número de documento</label>
        <input id="identityNumber" class="form-control" [(ngModel)]="user.identityNumber" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="name">Nombre</label>
        <input id="name" class="form-control" [(ngModel)]="user.name" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="secondName">Segundo nombre</label>
        <input id="secondName" class="form-control" [(ngModel)]="user.secondName" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="lastName">Apellido</label>
        <input id="lastName" class="form-control" [(ngModel)]="user.lastName" />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="codeArea">Código de área</label>
        <input id="codeArea" class="form-control" [(ngModel)]="user.codeArea" />
      </div>
      <div class="col-md-8">
        <label class="form-label" for="phoneNumber">Teléfono</label>
        <input id="phoneNumber" class="form-control" [(ngModel)]="user.phoneNumber" />
      </div>
    </div>

    <div class="account-actions">
      <button class="btn btn-success" type="button" (click)="saveInformation()" [disabled]="isSaving || isUploading">
        <i class="bi bi-check2" aria-hidden="true"></i>
        {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
      </button>
      <span class="text-success" *ngIf="message">{{ message }}</span>
      <span class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</span>
    </div>
  </div>
</section>

<p class="text-center py-5" *ngIf="isLoading">Cargando información...</p>
<p class="text-danger text-center py-5" *ngIf="!isLoading && !user">{{ errorMessage }}</p>
