<form (ngSubmit)="onSubmit()" class="mt-3" [formGroup]="billingForm">

  <div class="row">
    <h3 class="text-center">Datos de facturación</h3>
    <br />
    <br />
    <div class="col-md-6">

      <div>
        <label for="name" class="form-label">Nombre Completo</label>
        <input type="text" id="name" name="name" class="form-control" formControlName="name" 
          [(ngModel)]="billingData.customerName"
          [ngClass]="{ 'error': billingForm.errors?.['name']}">

        <div [hidden]="billingForm.get('name')?.valid || billingForm.get('name')?.pristine" class="alert alert-danger mt-3">
          Ingresar el nombre completo
        </div> 
      </div>

      <div>
        <label for="address" class="form-label">Dirección</label>
        <input type="text" id="address" name="address" class="form-control" [(ngModel)]="billingData.address" 
           [ngClass]="{ 'error': !billingForm.get('address')?.valid && !billingForm.get('address')?.pristine  }" formControlName="address" />

        <div [hidden]="billingForm.get('address')?.valid || billingForm.get('address')?.pristine" class="alert alert-danger mt-3">
          Ingresar la dirección
        </div>
      </div>

      <div>
        <label for="city" class="form-label">Ciudad</label>
        <input type="text" id="city" name="city" class="form-control" [(ngModel)]="billingData.city"
          formControlName="city" [ngClass]="{ 'error': billingForm.get('city')?.invalid && !billingForm.get('city')?.pristine }">
        <div [hidden]="billingForm.get('city')?.valid || billingForm.get('city')?.pristine" class="alert alert-danger mt-3">
          Ingresar la ciudad
        </div>
      </div>

      <div>
        <label for="state" class="form-label">Provincia</label>
        <input type="text" id="state" name="state" class="form-control" [(ngModel)]="billingData.state"
          formControlName="state" [ngClass]="{ 'error': billingForm.get('state')?.invalid && !billingForm.get('state')?.pristine }">
        <div [hidden]="billingForm.get('state')?.valid || billingForm.get('state')?.pristine">
          <div class="alert alert-danger mt-3">
            Ingresar la provincia
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">

      <div>
        <label for="zip" class="form-label">Codigo Postal</label>
        <input type="text" id="zip" name="zip" class="form-control" [(ngModel)]="billingData.zipCode"
          formControlName="zip" [ngClass]="{ 'error': billingForm.get('zip')?.invalid && !billingForm.get('zip')?.pristine }">
        <div [hidden]="billingForm.get('zip')?.valid || billingForm.get('zip')?.pristine" class="alert alert-danger mt-3">
          Ingresar el codigo postal
        </div>
      </div>
      <div>
        <label for="country" class="form-label">Pais</label>
        <input type="text" id="country" name="country" class="form-control" [(ngModel)]="billingData.country"
          formControlName="country" [ngClass]="{error: billingForm.get('country')?.invalid && !billingForm.get('country')?.pristine}" />
        <div [hidden]="billingForm.get('country')?.valid || billingForm.get('country')?.pristine" class="alert alert-danger mt-3">
          Ingresar el pais
        </div>
      </div>

      <div>
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" [(ngModel)]="billingData.email" formControlName="email" [ngClass]="{error: billingForm.get('email')?.invalid && !billingForm.get('email')?.pristine}" />
        <div [hidden]="billingForm.get('email')?.valid || billingForm.get('email')?.pristine" class="alert alert-danger mt-3">
          Ingresar el email
        </div>

      </div>

      <div>
        <label for="phone" class="form-label">Número de telefono</label>
        <input type="text" id="phone" name="phone" class="form-control" [(ngModel)]="billingData.phoneNumber" formControlName="phone"
         [ngClass]="{error: billingForm.get('phone')?.invalid && !billingForm.get('phone')?.pristine}" />
      <div [hidden]="billingForm.get('phone')?.valid || billingForm.get('phone')?.pristine" class="alert alert-danger mt-3">
        Debe ingresar un número de teléfono
      </div>
      </div>

    </div>
    <div class="mt-3 text-end">
      <button type="submit" class="btn btn-success" [disabled]="billingForm.invalid">Siguiente</button>
    </div>

  </div>

</form>
