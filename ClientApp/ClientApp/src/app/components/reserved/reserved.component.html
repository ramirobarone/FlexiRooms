<section class="card reserved-card" aria-labelledby="reserved-title">
  <div class="card-body">
    <p id="reserved-title" class="card-title">Reserva</p>
    <h2 class="reserved-room">{{ selectedRoom.name }}</h2>

    <label class="form-label" for="reserved-date">Fecha</label>
    <input id="reserved-date" type="date" class="form-control mb-3" />

    <ul class="reserved-slots" aria-label="Franjas horarias">
      <li><p>00:00 – 07:00</p></li>
      <li><p>08:00 – 15:00</p></li>
      <li><p>16:00 – 23:00</p></li>
    </ul>

    <div class="reserved-footer">
      <span class="reserved-cost">$ {{ cost }}</span>
      <button type="button" class="btn btn-success">Pagar</button>
    </div>
  </div>
</section>
